[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "carla_env"
authors = [
    {name = "Vo Thanh Nguyen", email = "nguyenvothanh04@gmail.com"},
]
dynamic = ["version", "description"]
dependencies = [
    "carla==0.9.16",
    "cloudpickle==3.0.0",
    "crafter==1.8.3",
    "dm-control==1.0.18",
    "einops>=0.8.1",
    "ffmpeg==1.4",
    "flask==3.0.3",
    "gym==0.12.5",
    "imageio==2.34.1",
    "lpips>=0.1.4",
    "matplotlib==3.8.4",
    "moviepy==1.0.3",
    "msgpack>=1.1.2",
    "networkx==3.1",
    "numpy==1.24.3",
    "opencv-python>=4.9,<5.0",
    "pygame>=2.6.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pyyaml==6.0.1",
    "pyzmq>=27.1.0",
    "rich>=15.0.0",
    "ruamel-yaml==0.18.6",
    "scikit-image==0.23.2",
    "scikit-learn>=1.7.2",
    "shapely==1.8.4",
    "tabulate==0.9.0",
    "tensorboard>=2.20.0",
    "torch",
    "torchvision",
    "typing-extensions>=4.10.0",
    "wandb==0.16.6",
]
requires-python = "==3.10.*"
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.pytest.ini_options]
addopts = "--cov=torch_wm --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
omit = [
    "torch_wm/rl/embodied/*",
    "torch_wm/rl/config/*",
    "torch_wm/envs/*",
    "torch_wm/models/custom/*",
    "torch_wm/modules/attentions/cross_attention.py",
    "torch_wm/modules/attentions/self_attention.py",
    "torch_wm/modules/networks/vit.py",
    "torch_wm/modules/networks/vit_predictor.py",
]
